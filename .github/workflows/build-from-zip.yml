
name: Build Hazeline APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Hazeline project
        run: |
          unzip -q Hazeline-merged-final.zip -d hazeline-src
          test -f hazeline-src/settings.gradle.kts
          test -f hazeline-src/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Compile APK
        working-directory: hazeline-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: test -s hazeline-src/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hazeline-debug-apk
          path: hazeline-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Save build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hazeline-build-diagnostics
          path: |
            hazeline-src/app/build/reports/**
            hazeline-src/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
